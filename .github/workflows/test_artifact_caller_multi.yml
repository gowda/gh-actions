name: TEST B — multi-file artifact

# Verification scenario B for PLAT-2401 (gha-workflows `pre-build-artifact` input).
# `setup` writes MULTIPLE files (flat at root plus a nested subdirectory)
# under `artifact-out/` and uploads the whole tree as one artifact. `publish`
# needs: setup and calls the reusable workflow, which downloads the tree at
# the specified path.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    environment: test-gated
    steps:
      - uses: actions/checkout@v7
      - name: Write multiple files (flat + nested)
        env:
          FAKE_SECRET: ${{ secrets.TEST_ARTIFACT_SECRET }}
        run: |
          mkdir -p artifact-out/subdir
          # Flat files at root — finance-service ZATCA style
          echo "cert-content-$FAKE_SECRET"        > artifact-out/cert.pem
          echo "private-key-content-$FAKE_SECRET" > artifact-out/private-key.pem
          echo "csr-content-$FAKE_SECRET"         > artifact-out/generated-csr.csr
          echo "warmup-content-$FAKE_SECRET"      > artifact-out/warmup-cert.pem
          # Nested file to prove directory hierarchy is preserved on download
          echo "root-ca-content-$FAKE_SECRET"     > artifact-out/subdir/root-ca.pem
          # Metadata / manifest at root
          {
            echo "test_case=multi-file"
            echo "run_id=$GITHUB_RUN_ID"
            echo "file_count=6"
          } > artifact-out/manifest.txt
          echo "setup wrote:"
          find artifact-out -type f | sort
      - uses: actions/upload-artifact@v7
        with:
          name: multi-file-bundle
          path: artifact-out/ # directory upload path
          retention-days: 1

  publish:
    needs: setup
    uses: ./.github/workflows/test_artifact_reusable.yml
    with:
      pre-build-artifact: multi-file-bundle
      pre-build-artifact-path: downloaded-artifact

  cleanup-pre-build-artifact:
    needs: [setup, publish]
    if: ${{ always() && needs.setup.outputs.artifact_id != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.setup.outputs.artifact_id }}
        run: gh api -X DELETE "/repos/${GH_REPO}/actions/artifacts/${ARTIFACT_ID}"
